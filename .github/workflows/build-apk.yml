name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool libltdl-dev \
            pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev build-essential

      - name: Install Buildozer
        run: pip install --upgrade buildozer "Cython==3.0.11" setuptools

      - name: Cache Buildozer downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec', 'recipes/**') }}

      - name: Build APK
        run: |
          set -o pipefail
          yes | buildozer -v android debug 2>&1 | tee build.log

      - name: Show build error
        if: failure()
        run: |
          # Publish the end of the log as an annotation (visible without signing in)
          # Buildozer prints an environment dump after "Command failed", so show what came before it
          sed 's/\x1b\[[0-9;]*m//g' build.log > clean.log
          n=$(grep -n "Command failed" clean.log | tail -1 | cut -d: -f1)
          n=${n:-$(wc -l < clean.log)}
          start=$(( n > 100 ? n - 100 : 1 ))
          # GitHub truncates long annotations, so post the lines in chunks of 20
          sed -n "${start},$((n + 2))p" clean.log | cut -c1-220 | sed 's/%/%25/g' > tail.log
          split -l 20 -d tail.log chunk_
          for f in chunk_*; do
            echo "::error title=Build log $f::$(sed ':a;N;$!ba;s/\n/%0A/g' "$f")"
          done

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: USC-V1-apk
          path: bin/*.apk
