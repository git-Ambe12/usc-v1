name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system packages
        run: |
          # Ubuntu mirrors occasionally fail; retry a few times before giving up
          for attempt in 1 2 3; do
            sudo apt-get update -o Acquire::Retries=3 &&
            sudo apt-get install -y -o Acquire::Retries=3 git zip unzip autoconf automake \
              libtool libltdl-dev pkg-config zlib1g-dev libncurses-dev cmake libffi-dev \
              libssl-dev build-essential && break
            [ "$attempt" = 3 ] && exit 1
            echo "apt-get failed, retrying in 30s..."; sleep 30
          done

      - name: Install Buildozer
        run: pip install --upgrade buildozer "Cython==3.0.11" setuptools

      - name: Cache Buildozer downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec', 'recipes/**') }}

      - name: Build APK
        run: |
          yes | buildozer -v android debug 2>&1 | tee build.log
          # Use buildozer's exit code; `yes` always exits with SIGPIPE
          exit ${PIPESTATUS[1]}

      - name: Show build error
        if: failure()
        run: |
          # Publish the end of the log as an annotation (visible without signing in)
          # Buildozer prints an environment dump after "Command failed", so show what came before it
          sed 's/\x1b\[[0-9;]*m//g' build.log > clean.log
          {
            # Gradle's explanation of the failure, if any
            awk '/What went wrong/ {f=1} f {print; if (++n >= 30) exit}' clean.log
            # Compiler / pip / python errors anywhere in the log
            grep -E "error:|Error:|ERROR:|FAILED|Exception|Traceback" clean.log | grep -v "^export " | tail -25
            # Lines just before buildozer gave up, minus its environment dump
            n=$(grep -n "Command failed" clean.log | tail -1 | cut -d: -f1)
            n=${n:-$(wc -l < clean.log)}
            sed -n "$(( n > 40 ? n - 40 : 1 )),${n}p" clean.log | grep -v "^export "
          } | cut -c1-220 | sed 's/%/%25/g' > tail.log
          # GitHub truncates long annotations, so post the lines in chunks of 20
          split -l 20 -d tail.log chunk_
          for f in chunk_*; do
            echo "::error title=Build log $f::$(sed ':a;N;$!ba;s/\n/%0A/g' "$f")"
          done

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: USC-V1-apk
          path: bin/*.apk
